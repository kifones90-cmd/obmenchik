<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Обмен</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="settings.js"></script>
<style>
:root{
  --bg:#0D0F12; --surface:#14171C; --raise:#1B1F26; --line:#242932;
  --text:#ECEAE4; --muted:#868C96; --accent:#CDB78B; --accent-ink:#1A150B;
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --sans:'Inter Tight',-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans)}
body{
  padding:calc(env(safe-area-inset-top,0px) + 20px) 18px calc(env(safe-area-inset-bottom,0px) + 84px);
  display:flex;flex-direction:column;max-width:480px;margin:0 auto;
}
header{display:flex;justify-content:space-between;align-items:baseline;padding:8px 4px 22px}
h1{font-family:var(--serif);font-weight:400;font-size:34px;letter-spacing:-.01em}
.status{font-size:12px;color:var(--muted)}
.status i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px 18px 16px}
.card .label{font-size:13px;color:var(--muted);margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.amount{
  flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);
  font-family:var(--serif);font-size:44px;line-height:1.1;letter-spacing:-.01em;width:100%;
}
.amount::placeholder{color:#3A404B}
.amount.out{color:var(--text)}
.usd{font-size:12.5px;color:var(--muted);margin-top:8px;min-height:16px}

.token{
  display:flex;align-items:center;gap:8px;background:var(--raise);border:1px solid var(--line);
  color:var(--text);font:500 15px var(--sans);padding:8px 12px 8px 8px;border-radius:999px;cursor:pointer;flex-shrink:0;
}
.token:active{transform:scale(.97)}
.badge{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;
  background:#0D0F12;border:1px solid var(--accent);color:var(--accent)}
.chev{width:8px;height:8px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg) translateY(-2px);margin-left:2px}

.swap-wrap{display:flex;justify-content:center;height:0;position:relative;z-index:2}
.swap{
  position:absolute;top:-20px;width:40px;height:40px;border-radius:50%;
  background:var(--bg);border:1px solid var(--line);color:var(--accent);display:grid;place-items:center;cursor:pointer;
  transition:transform .35s cubic-bezier(.2,.8,.2,1);
}
.swap.turn{transform:rotate(180deg)}
.swap svg{width:18px;height:18px}
.gap{height:8px}

.info{margin:20px 4px 0;display:flex;flex-direction:column;gap:12px}
.info div{display:flex;justify-content:space-between;font-size:14px}
.info span:first-child{color:var(--muted)}

.spacer{flex:1;min-height:24px}
.cta{
  width:100%;border:0;border-radius:18px;padding:18px;font:600 16px var(--sans);
  background:var(--accent);color:var(--accent-ink);cursor:pointer;transition:opacity .2s,transform .15s;
}
.cta:active{transform:scale(.985)}
.cta:disabled{background:var(--raise);color:#5B616C;cursor:default}
.note{text-align:center;font-size:12px;color:var(--muted);margin-top:12px}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--surface);border:1px solid var(--line);
  border-radius:26px 26px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom,0px) + 18px);
  transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:11;
}
.sheet.open{transform:none}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}
.sheet h2{font-family:var(--serif);font-weight:400;font-size:26px;margin-bottom:8px}
.opt{width:100%;display:flex;align-items:center;gap:14px;background:none;border:0;color:var(--text);
  font:500 16px var(--sans);padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left}
.opt:last-child{border-bottom:0}
.opt small{display:block;color:var(--muted);font-weight:400;font-size:13px;margin-top:2px}
.opt .price{margin-left:auto;color:var(--muted);font-size:14px;font-weight:400}
.opt.sel .badge{background:var(--accent);color:var(--accent-ink)}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.view{display:none;flex:1;flex-direction:column}.view.on{display:flex}
.tabs{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;display:flex;background:rgba(13,15,18,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 8px);z-index:5}
.inflow .tabs{display:none}
.tab{flex:1;background:none;border:0;color:var(--muted);font:500 12px var(--sans);display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;cursor:pointer}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
.back{background:none;border:0;color:var(--muted);font:500 15px var(--sans);cursor:pointer;padding:0}
.prog{display:flex;gap:6px;margin:0 0 26px}.prog i{flex:1;height:3px;border-radius:2px;background:var(--line);transition:background .3s}.prog i.on{background:var(--accent)}
.kv{display:flex;justify-content:space-between;gap:16px;font-size:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}.kv span:first-child{color:var(--muted)}.kv span:last-child{text-align:right}
.big{font-family:var(--serif);font-size:34px;line-height:1.15;margin:4px 0 6px}
.sub{color:var(--muted);font-size:14px;line-height:1.5}
.field{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;color:var(--text);font:400 15px var(--sans);outline:0;margin-top:10px}
.field:focus{border-color:var(--accent)}
.addr{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;font-size:15px;word-break:break-all;margin:14px 0 10px}
.ghost{width:100%;background:var(--raise);border:1px solid var(--line);color:var(--text);border-radius:16px;padding:15px;font:500 15px var(--sans);cursor:pointer;margin-top:10px}
.hi{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.hi:last-child{border-bottom:0}.hi small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
.hi .r{text-align:right;font-size:14px}.ok{color:var(--accent)}.wait{color:var(--muted)}
.empty{margin:auto;text-align:center;color:var(--muted);font-size:14px;line-height:1.5;padding:0 30px}
.empty b{display:block;font-family:var(--serif);font-weight:400;font-size:26px;color:var(--text);margin-bottom:6px}
.me{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.ava{width:56px;height:56px;border-radius:50%;border:1px solid var(--accent);color:var(--accent);display:grid;place-items:center;font:400 26px var(--serif)}
.me b{font:400 24px var(--serif);display:block}
.set{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:var(--text);font:400 15px var(--sans);padding:17px 0;cursor:pointer;text-align:left}
.set:last-child{border-bottom:0}.set em{font-style:normal;color:var(--muted)}
.tg{width:44px;height:26px;border-radius:13px;background:var(--raise);border:1px solid var(--line);position:relative;transition:background .2s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.tg.on{background:var(--accent)}.tg.on::after{transform:translateX(18px);background:var(--accent-ink)}

.sec{font:400 22px var(--serif);margin:28px 0 6px}
.mini{display:flex;gap:8px;margin-top:10px}
.mini button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--raise);color:var(--text);font:500 13px var(--sans);cursor:pointer}
.mini button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bad{color:#C98A8A}
.row2{display:flex;gap:10px;align-items:center}.row2 .field{margin-top:0;flex:1}.row2 .ghost{width:auto;margin-top:0;padding:15px 18px}
.lbl{font-size:13px;color:var(--muted);margin:16px 0 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.chip{background:var(--raise);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:9px 14px;font:500 14px var(--sans);cursor:pointer}
.chip.on{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>

<main class="view on" id="v-buy">
<header><h1>Покупка</h1><div class="status"><i></i><span id="bupd">Курс загружается</span></div></header>
<section class="card">
  <div class="label">Вы платите</div>
  <div class="row"><input id="bAmt" class="amount" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="Сумма в рублях"><div class="token"><span class="badge">₽</span>RUB</div></div>
  <div class="usd" id="bLim"></div>
</section>
<div style="height:12px"></div>
<section class="card">
  <div class="label">Вы получаете</div>
  <div class="row"><input id="bOut" class="amount out" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="Сколько криптовалюты получить"><button class="token" id="bTok" aria-label="Выбрать монету"></button></div>
  </section>
<div class="info">
  <div><span>Курс</span><span id="bRate">—</span></div>
  <div><span>Оплата</span><span id="bPay">—</span></div>
  <div><span>Время</span><span>около 15 минут</span></div>
</div>
<div class="spacer"></div>
<button class="cta" id="bCta" disabled>Введите сумму</button>
</main>

<main class="view" id="v-swap">
<header>
  <h1>Обмен</h1>
  <div class="status"><i></i><span id="upd">Курс загружается</span></div>
</header>

<section class="card">
  <div class="label">Отдаёте</div>
  <div class="row">
    <input id="amt" class="amount" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="Сумма к обмену">
    <button class="token" id="fromBtn" aria-label="Выбрать монету, которую отдаёте"></button>
  </div>
  <div class="usd" id="fromUsd"></div>
</section>

<div class="swap-wrap">
  <button class="swap" id="swap" aria-label="Поменять местами">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4v16M8 20l-4-4M8 20l4-4M16 20V4M16 4l-4 4M16 4l4 4"/></svg>
  </button>
</div>
<div class="gap"></div>

<section class="card">
  <div class="label">Получаете</div>
  <div class="row">
    <input id="out" class="amount out" placeholder="0" readonly aria-label="Сумма к получению">
    <button class="token" id="toBtn" aria-label="Выбрать монету, которую получаете"></button>
  </div>
  <div class="usd" id="toUsd"></div>
</section>

<div class="info">
  <div><span>Курс</span><span id="rate">—</span></div>
  <div><span>Комиссия</span><span id="feeTxt">0,5%</span></div>
  <div><span>Время обмена</span><span>около 5 минут</span></div>
</div>

<div class="spacer"></div>
<button class="cta" id="cta" disabled>Введите сумму</button>
<div class="note">Демо-версия: курсы ориентировочные</div>
</main>

<main class="view" id="v-hist">
  <header><h1>История</h1></header>
  <div id="histBody" style="display:flex;flex-direction:column;flex:1"></div>
</main>

<main class="view" id="v-prof">
  <header><h1>Профиль</h1></header>
  <div id="profBody"></div>
</main>

<main class="view" id="v-flow">
  <header><button class="back" id="flowBack">Назад</button><span class="status" id="flowTitle"></span></header>
  <div class="prog" id="prog"><i></i><i></i><i></i></div>
  <div id="flowBody" style="display:flex;flex-direction:column;flex:1"></div>
</main>

<main class="view" id="v-admin">
  <header><button class="back" id="admBack">Назад</button><span class="status">Админ-панель</span></header>
  <div id="admBody"></div>
</main>

<nav class="tabs">
  <button class="tab on" data-v="buy"><svg viewBox="0 0 24 24"><rect x="3.5" y="6.5" width="17" height="12" rx="3"/><path d="M3.5 10.5h17M16 14.5h1.5"/></svg>Покупка</button>
  <button class="tab" data-v="swap"><svg viewBox="0 0 24 24"><path d="M7 7h11M18 7l-3-3M18 7l-3 3M17 17H6M6 17l3-3M6 17l3 3"/></svg>Обмен</button>
  <button class="tab" data-v="hist"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>История</button>
  <button class="tab" data-v="prof"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.5"/><path d="M5 19.5c1-3.5 4-5 7-5s6 1.5 7 5"/></svg>Профиль</button>
</nav>

<div class="overlay" id="ov"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Выбор монеты">
  <div class="grab"></div>
  <h2>Выберите монету</h2>
  <div id="list"></div>
</div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor('#0D0F12'); tg.setBackgroundColor('#0D0F12'); } catch(e){}
}
const haptic = (t='light') => { try { tg.HapticFeedback.impactOccurred(t); } catch(e){} };

let FEE = 0.005; try { const f = localStorage.getItem('fee'); if (f) FEE = parseFloat(f); } catch(e){}
let paused = false; try { paused = localStorage.getItem('paused') === '1'; } catch(e){}
const ADMIN_IDS = []; // впишите сюда свой Telegram ID, например [123456789]
const pct = () => (FEE * 100).toLocaleString('ru-RU', {maximumFractionDigits:2}) + '%';
const tokens = [
  {sym:'BTC',  name:'Bitcoin',  cg:'bitcoin',         price:95000, dec:6},
  {sym:'ETH',  name:'Ethereum', cg:'ethereum',        price:3200,  dec:5},
  {sym:'USDT', name:'Tether',   cg:'tether',          price:1,     dec:2},
  {sym:'TON',  name:'Toncoin',  cg:'the-open-network',price:3.2,   dec:3},
  {sym:'SOL',  name:'Solana',   cg:'solana',          price:190,   dec:4},
];
const by = s => tokens.find(t => t.sym === s);
tokens.forEach(t => t.rub = t.price * 95);
let from = 'BTC', to = 'USDT', pick = null;

const $ = id => document.getElementById(id);
const fmt = (n, d) => n.toLocaleString('ru-RU', {maximumFractionDigits:d, minimumFractionDigits:0});
const usdFmt = n => '≈ ' + n.toLocaleString('ru-RU', {maximumFractionDigits:2}) + ' $';

function tokenBtn(el, sym){
  el.innerHTML = `<span class="badge">${sym[0]}</span>${sym}<span class="chev"></span>`;
}
function parse(){ return parseFloat(($('amt').value || '').replace(',', '.')) || 0; }

function render(){
  tokenBtn($('fromBtn'), from); tokenBtn($('toBtn'), to);
  const f = by(from), t = by(to), a = parse();
  const raw = f.price / t.price;
  const out = a * raw * (1 - FEE);
  $('out').value = a > 0 ? fmt(out, t.dec) : '';
  $('fromUsd').textContent = a > 0 ? usdFmt(a * f.price) : '';
  $('toUsd').textContent = a > 0 ? usdFmt(out * t.price) : '';
  $('rate').textContent = `1 ${from} = ${fmt(raw, t.dec)} ${to}`;
  const cta = $('cta');
  $('feeTxt').textContent = pct();
  cta.disabled = !(a > 0) || paused;
  cta.textContent = paused ? 'Обмен временно недоступен' : (a > 0 ? 'Обменять' : 'Введите сумму');
}

$('amt').addEventListener('input', e => {
  e.target.value = e.target.value.replace(/[^0-9.,]/g, '');
  render();
});

$('swap').addEventListener('click', () => {
  [from, to] = [to, from];
  $('amt').value = '';
  $('swap').classList.toggle('turn');
  haptic(); render();
});

function openSheet(which){
  pick = which; haptic();
  const cur = which === 'from' ? from : which === 'buy' ? buyTok : to;
  $('list').innerHTML = tokens.map(t => `
    <button class="opt ${t.sym===cur?'sel':''}" data-s="${t.sym}">
      <span class="badge">${t.sym[0]}</span>
      <span>${t.sym}<small>${t.name}</small></span>
      <span class="price">${which === 'buy' ? fmt(t.rub, t.rub < 100 ? 2 : 0) + ' ₽' : fmt(t.price, t.price < 10 ? 2 : 0) + ' $'}</span>
    </button>`).join('');
  $('ov').classList.add('open'); $('sheet').classList.add('open');
}
function closeSheet(){ $('ov').classList.remove('open'); $('sheet').classList.remove('open'); }

$('fromBtn').onclick = () => openSheet('from');
$('toBtn').onclick = () => openSheet('to');
$('ov').onclick = closeSheet;
$('list').addEventListener('click', e => {
  const b = e.target.closest('.opt'); if (!b) return;
  const s = b.dataset.s;
  if (pick === 'buy') { buyTok = s; closeSheet(); haptic(); renderBuy(); return; }
  if (pick === 'from') { if (s === to) to = from; from = s; }
  else { if (s === from) from = to; to = s; }
  $('amt').value = '';
  closeSheet(); haptic(); render();
});

$('cta').addEventListener('click', () => { haptic('medium'); startFlow(); });

/* ---------- экраны ---------- */
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let hist = []; try { hist = JSON.parse(localStorage.getItem('hist') || '[]'); } catch(e){}
const saveHist = () => { try { localStorage.setItem('hist', JSON.stringify(hist)); } catch(e){} };
let order = null;

function show(v){
  ['buy','swap','hist','prof','flow','admin'].forEach(x => $('v-'+x).classList.toggle('on', x === v));
  document.body.classList.toggle('inflow', v === 'flow');
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.v === v));
  if (v === 'hist') renderHist();
  if (v === 'prof') renderProf();
  if (v === 'admin') { renderAdmin(); if (SERVER) loadAdmin(); }
  if (SERVER && (v === 'hist' || v === 'prof')) boot().then(() => { if ($('v-' + v).classList.contains('on')) { v === 'hist' ? renderHist() : renderProf(); } });
  window.scrollTo(0, 0);
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => { haptic(); show(t.dataset.v); });

function startFlow(){
  order = {from, to, amt:$('amt').value, out:$('out').value, rate:$('rate').textContent,
           id:Math.floor(100000 + Math.random()*900000), step:1, addr:''};
  show('flow'); renderFlow();
}
$('flowBack').onclick = () => {
  if (order && order.step === 2) { order.step = 1; renderFlow(); }
  else show(order && order.type === 'buy' ? 'buy' : 'swap');
};

function renderFlow(){
  const o = order, b = $('flowBody');
  document.querySelectorAll('#prog i').forEach((e,i) => e.classList.toggle('on', i < o.step));
  $('flowTitle').textContent = ['','Подтверждение','Отправка','Готово'][o.step];
  $('flowBack').style.visibility = o.step === 3 ? 'hidden' : 'visible';
  if (o.step === 2 && o.type === 'buy') { renderBuyPay(); return; }

  if (o.step === 1) {
    b.innerHTML = `
      <div class="card">
        <div class="kv"><span>Отдаёте</span><span>${esc(o.amt)} ${cs(o.from)}</span></div>
        <div class="kv"><span>Получаете</span><span>${esc(o.out)} ${o.to}</span></div>
        <div class="kv"><span>Курс</span><span>${esc(o.rate)}</span></div>
        <div class="kv"><span>Комиссия</span><span>${o.type === 'buy' ? 'включена в курс' : pct()}</span></div>
      </div>
      ${o.type === 'buy'
        ? `<p class="sub" style="margin-top:22px">Купленные ${o.to} появятся на балансе в профиле после подтверждения оплаты.</p>`
        : `<p class="sub" style="margin-top:22px">Адрес кошелька для получения ${o.to}</p>
      <input class="field" id="addrIn" placeholder="Вставьте адрес" autocomplete="off" value="${esc(o.addr)}">`}
      <div class="spacer"></div>
      <button class="cta" id="next" ${o.type !== 'buy' && o.addr.length < 10 ? 'disabled' : ''}>Продолжить</button>`;

    $('next').onclick = () => { haptic(); o.step = 2; renderFlow(); };
  }

  if (o.step === 2) {
    o.dep = o.dep || 'demo-' + o.from.toLowerCase() + '-' + Math.random().toString(36).slice(2, 14);
    b.innerHTML = `
      <div class="big">Отправьте ${esc(o.amt)} ${o.from}</div>

  if (o.step === 3) {

      <div class="big">${o.done ? 'Обмен завершён' : 'Проверяем перевод'}</div>
      <p class="sub">${o.done

      <div class="card" style="margin-top:22px">
        <div class="kv"><span>Заявка</span><span>№${o.id}</span></div>
        <div class="kv"><span>Статус</span><span class="${o.done ? 'ok' : 'wait'}">${o.done ? 'Завершён' : 'В обработке'}</span></div>
      </div>

      <button class="ghost" id="toHist">Открыть историю</button>
      <button class="cta" id="fin" style="margin-top:10px">Готово</button>`;
    $('toHist').onclick = () => show('hist');
    $('fin').onclick = () => {
      if (o.type === 'buy') { $('bAmt').value = ''; $('bOut').value = ''; buySrc = 'rub'; renderBuy(); show('buy'); }
      else { $('amt').value = ''; render(); show('swap'); }
    };
  }
}

  let h = f('rMin', 'Минимальная сумма покупки, ₽', req.min, 'numeric') + f('rMax', 'Максимальная сумма, ₽', req.max, 'numeric') +
    f('rMk', 'Наценка к курсу, %', req.markup, 'decimal') + '<button class="ghost" id="rLim" style="margin-top:14px">Сохранить лимиты</button>';
  h += `<div class="lbl" style="margin-top:24px">Реквизиты · ${req.list.length} из 5</div>`;
  req.list.forEach((x, i) => {
    h += `<button class="set" data-ri="${i}">${esc(x.bank || 'Без названия')} · ${last4(x)}<em>${editIdx === i ? 'Закрыть' : 'Изменить'}</em></button>`;
    if (editIdx === i) h += form(x);
  });
  if (editIdx === 'new') h += form({});
  else if (req.list.length < 5) h += '<button class="ghost" id="rAdd">Добавить реквизит</button>';
  return h;
}

async function api(action, data){
  if (!API_URL) throw new Error('не заполнен API_URL (файл settings.js)');
  let r;
  try {
    r = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action, initData:(tg && tg.initData) || '', ...data})});
  } catch(e){ throw new Error('нет связи с сервером'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.ok === false) throw new Error(j.error || ('код ' + r.status));
  return j;
}

async function boot(){
  try {
    const r = await api('boot');
    isAdminSrv = !!r.isAdmin;
    if (r.config) {
      if (typeof r.config.fee === 'number') FEE = r.config.fee;
      paused = !!r.config.paused;
      req = {...req, ...r.config.req}; fixReq();
    } else if (isAdminSrv) pushConfig();
    bal = r.balances || {};
    const srv = r.orders || [];
    const fresh = hist.filter(h => h.key && Date.now() - h.ts < 120000 && !srv.some(o => o.key === h.key));
    hist = [...fresh, ...srv];
  } catch(e){ $('upd').textContent = $('bupd').textContent = 'нет связи с сервером'; }
  render(); renderBuy();
}

async function pushConfig(){
  if (!SERVER || !isAdminSrv) return;
  try { await api('admin.config', {config:{fee:FEE, paused, req}}); }
  catch(e){ msg('Не сохранилось на сервере: ' + e.message); }
}

async function loadAdmin(){
  try { allOrders = (await api('admin.orders')).orders || []; } catch(e){ msg(e.message); }
  renderAdmin();
}

let bal = {}; try { bal = JSON.parse(localStorage.getItem('bal') || '{}'); } catch(e){}
const saveBal = () => { try { localStorage.setItem('bal', JSON.stringify(bal)); } catch(e){} };

async function loadRates(){
  try {
    const ids = tokens.map(t => t.cg).join(',');
    const r = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd,rub`);
    const d = await r.json();
    tokens.forEach(t => { if (d[t.cg] && d[t.cg].usd) t.price = d[t.cg].usd; if (d[t.cg] && d[t.cg].rub) t.rub = d[t.cg].rub; });
    $('upd').textContent = $('bupd').textContent = 'Курс обновлён';
  } catch(e) {
    $('upd').textContent = $('bupd').textContent = 'Курс ориентировочный';
  }
  render(); renderBuy();
}
render(); renderBuy(); loadRates(); SERVER ? boot() : loadConfig();
setInterval(() => { if (SERVER && isAdminSrv && $('v-admin').classList.contains('on')) loadAdmin(); }, 30000);
setInterval(loadRates, 60000);
</script>
